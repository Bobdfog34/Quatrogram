name: Quatrogram registration bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quatrogram-bot
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: bot
          fetch-depth: 1

      - name: Check bot token
        shell: bash
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is not set; skipping."
            exit 0
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: bot_state.db
          key: quatrogram-bot-state-${{ github.run_id }}
          restore-keys: quatrogram-bot-state-

      - name: Poll updates once
        run: python bot/bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ADMIN_USERNAMES: ${{ secrets.ADMIN_USERNAMES }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          NUMBER_PREFIX: ${{ vars.NUMBER_PREFIX || '+7000' }}
          CODE_TTL_MINUTES: ${{ vars.CODE_TTL_MINUTES || '5' }}
          BOT_ONE_SHOT: '1'
