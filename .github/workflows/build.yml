name: Build Litgram APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quatrogram-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Final branding cleanup (Telegram -> Litgram)
        run: python3 .github/scripts/final_branding.py
        env:
          APP_DISPLAY_NAME: Litgram

      - name: Litgram feature strings
        run: python3 .github/scripts/litgram_features.py

      - name: Build release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: '-Xmx6g'

      - name: Verify APK
        run: find TMessagesProj_App/build/outputs/apk -name '*.apk' -type f -printf '%p %s bytes\n'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Litgram-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
